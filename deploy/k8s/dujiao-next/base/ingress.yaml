# 橙云：沿用现在 Cloudflare 上的设置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dujiao-next
  annotations:
    external-dns.alpha.kubernetes.io/target: entry-cn.gosail.tech
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - store.gosail.tech
  rules:
    - host: store.gosail.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dujiao-next
                port:
                  name: http
