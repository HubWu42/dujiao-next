name: docker-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: hubwu42/dujiao-next

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout api
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Fullstack: admin + user frontends are in this monorepo ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Build admin
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:fullstack

      - name: Build user
        working-directory: user
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Embed frontend assets
        run: |
          mkdir -p internal/web/dist
          cp -r admin/dist internal/web/dist/admin
          cp -r user/dist  internal/web/dist/user

      # ---- Docker build & push ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
